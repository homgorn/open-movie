[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-movie-core"
version = "0.1.0"
description = "Universal Video Generation Pipeline — ASCII, AI Video, Hybrid backends"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "OPEN MOVIE Contributors", email = "openmovie@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "aiohttp>=3.8.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
saas = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "stripe>=7.0.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=1.38.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.12",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/open-movie"
Repository = "https://github.com/yourusername/open-movie"
Issues = "https://github.com/yourusername/open-movie/issues"
Documentation = "https://open-movie.readthedocs.io"

[project.scripts]
om = "open_movie_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_movie_core*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T20", "QF", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "PERF", "RET", "FLY", "ISC", "ICN", "PIE", "TCH", "LOG", "PD", "PGH", "RSE", "RUF", "SNP", "TD", "TRY", "WH", "INT"]
ignore = ["E501", "SIM102", "SIM103"]
fixable = ["ALL"]
unfixable = ["T20"]
exclude = ["__pycache__", ".git", "build", "dist", "*.egg-info", "work", "cache", "outputs", "frames"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring GPU",
]

[tool.coverage.run]
source = ["src/open_movie_core"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]