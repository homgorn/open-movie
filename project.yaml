project:
  id: "om-2026-001"
  title: "What It's Like to Be an LLM"
  duration: 148
  resolution: "1080x1920"
  fps: 30
  aspect: "9:16"

pipeline:
  backend: "hybrid"
  quality: "high"

scenes:
  - id: "void"
    start: 0
    end: 17
    description: "Infinite dark void, single blinking cursor in center, minimal, high contrast, philosophical atmosphere"
    parameters:
      character_consistency: "single white cursor, blinking at 1Hz"
    camera:
      type: "dolly"
      keyframes:
        - time: 0
          position: [0, 0, 16]
        - time: 17
          position: [0, 0, -374]
      easing: "ease-in-out"
    backend_hint: "ascii"

  - id: "vortex"
    start: 17
    end: 47
    description: "Particles forming a logarithmic spiral, glowing tokens emerging from center, rotating, accelerating into a vortex"
    parameters:
      particle_count: 5000
      spiral_turns: 8
      color_scheme: "cool_warm"
      ring_count: 12
      environment_consistency: "dark space with bioluminescent particles"
    camera:
      type: "dolly"
      keyframes:
        - time: 17
          position: [0, 0, -374]
        - time: 47
          position: [0, 0, -500]
      easing: "ease-in"
    backend_hint: "hybrid"

  - id: "sea"
    start: 47
    end: 70
    description: "Vast ocean of glowing text characters, waves of data rolling, rays of light piercing down from above through the water"
    parameters:
      wave_amplitude: 15
      grid_density: 0.3
      god_rays: true
      caustics: true
    camera:
      type: "dolly"
      keyframes:
        - time: 47
          position: [0, 10, -500]
        - time: 70
          position: [0, -5, -650]
      easing: "linear"
    backend_hint: "hybrid"

  - id: "library"
    start: 70
    end: 96
    description: "Infinite cathedral-like library, golden glowing books on towering shelves, arches stretching to infinity, dust motes dancing in light beams"
    parameters:
      shelf_count: 50
      book_texture: "golden leather, aged paper"
      dust_density: 0.15
      volumetric_lighting: true
      environment_consistency: "cathedral library, warm golden hour lighting"
    camera:
      type: "dolly"
      keyframes:
        - time: 70
          position: [0, 2, -650]
        - time: 96
          position: [0, 2, -900]
      easing: "ease-out"
    backend_hint: "hybrid"

  - id: "attention"
    start: 96
    end: 118
    description: "Geometric lattice of connected nodes, light pulses traveling along edges like neural signals, mathematical beauty, attention mechanism visualization"
    parameters:
      node_count: 10000
      connection_density: 0.02
      pulse_speed: 5.0
      lattice_type: "cylindrical"
      color_scheme: "cool_blue_white"
    camera:
      type: "orbit"
      keyframes:
        - time: 96
          position: [0, 0, -900]
          target: [0, 0, -950]
        - time: 118
          position: [0, 0, -1100]
          target: [0, 0, -1150]
      easing: "ease-in-out"
    backend_hint: "ascii"

  - id: "convergence"
    start: 118
    end: 136
    description: "Concentric rings collapsing toward center, forming a portal/gate, energy buildup, intense white flash at convergence, lens flare"
    parameters:
      ring_count: 7
      initial_radius: 20
      final_radius: 0.5
      flash_intensity: 1.0
      lens_flare: true
      environment_consistency: "dark space, energy convergence"
    camera:
      type: "dolly"
      keyframes:
        - time: 118
          position: [0, 0, -1100]
        - time: 136
          position: [0, 0, -1400]
      easing: "ease-in"
    backend_hint: "hybrid"

  - id: "finale"
    start: 136
    end: 148
    description: "Single cursor in vast darkness, faint echo rings expanding and fading, profound silence, final blink"
    parameters:
      echo_rings: 4
      ring_fade_time: 3.0
      final_blink: true
    camera:
      type: "static"
      keyframes:
        - time: 136
          position: [0, 1.3, -1400]
        - time: 148
          position: [0, 1.3, -1400]
    backend_hint: "ascii"

audio:
  style: "ambient"
  bpm: 60
  key: "Am"
  progression: ["Am9", "Fmaj7", "Dm9", "Em7"]
  loudnorm_target: -16
  generator: "procedural"
  cues:
    - time: 0
      type: "chord"
      params: { chord: "Am9", velocity: 0.3 }
    - time: 17
      type: "chord"
      params: { chord: "Fmaj7", velocity: 0.4 }
    - time: 47
      type: "sfx"
      params: { type: "whoosh", intensity: 0.2 }
    - time: 70
      type: "chord"
      params: { chord: "Dm9", velocity: 0.5 }
    - time: 96
      type: "chord"
      params: { chord: "Em7", velocity: 0.6 }
    - time: 118
      type: "sfx"
      params: { type: "energy_buildup", intensity: 0.8 }
    - time: 136
      type: "silence"
      params: { duration: 12 }

output:
  format: "mp4"
  codec: "libx264"
  crf: 18
  preset: "slow"
  pix_fmt: "yuv420p"
  audio_codec: "aac"
  audio_bitrate: "192k"
  resolution: "1080x1920"
  fps: 30
  movflags: "+faststart"